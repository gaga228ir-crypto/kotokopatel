<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1b1210;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:#120c0a;position:relative}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#3a2418;border-bottom:3px solid #1b1210;z-index:5}
.coins{font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:6px}
.coins img{width:24px;height:24px}
.hsub{flex:1;font-size:12px;line-height:1.25;text-shadow:1px 1px 0 #000}
.hsub b{color:#ffe066}
.pbtn{border:3px solid #1b1210;background:#6b4a2e;color:#fff;font-weight:900;border-radius:7px;box-shadow:inset 0 -3px 0 #00000055,inset 0 2px 0 #ffffff33;cursor:pointer;font-family:inherit}
.pbtn:active{transform:translateY(2px)}
.pbtn.green{background:#2fae5b}.pbtn.orange{background:#e8761b}.pbtn.purple{background:#7b3fc4}
.pbtn:disabled{filter:grayscale(.7) brightness(.7)}
#sound{width:36px;height:36px;font-size:16px}
#quest{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#2a1a12;border-bottom:3px solid #1b1210;z-index:5;min-height:44px}
#quest .qi{font-size:20px}
#quest .qt{flex:1;font-size:12px;font-weight:700}
.qbar{height:7px;background:#000a;border-radius:4px;overflow:hidden;margin-top:3px}
#qFill{height:100%;width:0;background:#ffd23f}
#qBtn{padding:6px 10px;font-size:12px;display:none}
#qBtn.show{display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#view{position:relative;flex:1;overflow:hidden}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#world{position:relative;width:100%}
#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.surf{position:absolute;left:0;right:0;top:0;overflow:hidden}
.surf canvas{position:absolute;left:0;top:0}
.row{position:absolute;left:0;right:0;overflow:hidden;border-top:3px solid #0008}
.rock{position:absolute;inset:0;background-size:48px 48px}
.tun{position:absolute;bottom:6px;height:66px;background:#0009;box-shadow:inset 0 6px 8px #000a,inset 0 -4px 6px #0006}
.face{position:absolute;right:0;bottom:6px;width:46px;height:66px;background-size:48px 48px;box-shadow:inset 6px 0 8px #0008}
.face img{position:absolute;width:18px}
.box{position:absolute;bottom:8px;width:56px;height:52px}.box img{width:56px;position:absolute;bottom:0;left:0}
.box span{position:absolute;top:-8px;z-index:1;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;white-space:nowrap}
.box i{display:none}
.rlabel{position:absolute;top:6px;font-size:13px;font-weight:900;text-shadow:2px 2px 0 #000;pointer-events:none}
.rlabel small{display:block;font-size:11px;font-weight:700;color:#ffe066}
.upb{position:absolute;top:6px;right:6px;padding:4px 8px;font-size:12px;line-height:1.15;text-align:center;min-width:76px;z-index:3}
.upb small{display:block;font-size:11px;color:#ffe066}
.upb.can{background:#2fae5b}
.upb .neck{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#d62c2c;border:2px solid #1b1210;border-radius:5px;font-size:10px;padding:1px 4px;display:none}
.upb.bn .neck{display:block}
.mgr{position:absolute;width:46px;height:46px;border-radius:50%;border:3px solid #1b1210;background:#00000080;padding:0;z-index:3;cursor:pointer;box-shadow:0 0 0 2px #ffffff40}
.mgr img{width:38px;height:38px;object-fit:contain;margin-top:1px}
.mgr.none img{filter:brightness(0) opacity(.6)}
.mgr.none::after{content:"+";position:absolute;right:-6px;bottom:-6px;background:#2fae5b;border:2px solid #1b1210;border-radius:50%;width:20px;height:20px;font-size:15px;line-height:15px;font-weight:900}
.mgr .ab{position:absolute;left:-6px;bottom:-6px;background:#e8761b;border:2px solid #1b1210;border-radius:10px;font-size:10px;line-height:14px;min-width:20px;font-style:normal;font-weight:900;padding:1px 4px;white-space:nowrap}
.mgr .ab.ready{animation:pulse .8s infinite;background:#ffd23f;color:#3a2418;font-size:11px}
.mgr .ab.act{background:#2fae5b}
.col{position:absolute;left:0;background:linear-gradient(90deg,#1a1210,#3a2a22 15%,#2a1e18 50%,#3a2a22 85%,#1a1210);border-right:3px solid #0008}
.col::before,.col::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:repeating-linear-gradient(#8a8a8a 0 6px,#5a5a5a 6px 12px)}
.col::before{left:6px}.col::after{right:6px}
.locked{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center}
.locked .rock{filter:brightness(.35)}
.locked button{position:relative;padding:10px 14px;font-size:15px}
.locked button small{display:block;font-size:12px;color:#ffe066}
.bld{position:absolute;pointer-events:none}
.head{background:#6b4325;border:3px solid #2a1a12;border-bottom:none;border-radius:6px 6px 0 0}
.head::before{content:"";position:absolute;left:50%;top:-22px;width:30px;height:30px;margin-left:-15px;border-radius:50%;border:5px solid #8a8a8a;background:radial-gradient(#5a5a5a 25%,transparent 27%)}
.wh{background:#a0602d;border:3px solid #2a1a12;box-shadow:inset 0 -10px 0 #7a4520}
.wh::before{content:"";position:absolute;left:-10px;right:-10px;top:-22px;height:22px;background:#b8452a;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-bottom:3px solid #2a1a12}
.wh b{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:11px;background:#2a1a12;margin:0 12px;border-radius:3px;padding:1px 0}
.wh i{position:absolute;bottom:0;left:50%;width:30px;height:32px;margin-left:-15px;background:#4a2a14;border:3px solid #2a1a12;border-bottom:none}
.pile{position:absolute;font-size:12px;font-weight:900;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;text-align:center;pointer-events:none}
.pile div{width:54px;height:20px;margin:2px auto 0;background:radial-gradient(ellipse at 50% 100%,#ffd23f 0 45%,#c98f12 46% 60%,transparent 62%)}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:17px;color:#ffe066;text-shadow:2px 2px 0 #000;animation:up 1s ease-out forwards;white-space:nowrap;z-index:4}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
nav{display:flex;gap:6px;padding:6px;background:#3a2418;border-top:3px solid #1b1210;z-index:5}
nav .pbtn{flex:1;padding:6px 2px;font-size:11px;line-height:1.2;position:relative}
nav .pbtn span{display:block;font-size:20px}
nav .dot{position:absolute;top:-6px;right:-4px;background:#d62c2c;border:2px solid #1b1210;border-radius:10px;font-size:10px;padding:0 5px;display:none}
nav .dot.on{display:block}
#bMove{display:none}
#bMove.on{display:block;animation:pulse 1s infinite}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.hidden{display:none}
.box2{background:#3a2418;border:4px solid #1b1210;box-shadow:0 0 0 3px #e0a400;border-radius:10px;padding:16px;max-width:360px;width:100%;text-align:center;max-height:92vh;overflow-y:auto}
#mImg{height:84px;margin-bottom:4px}
#mTitle{font-size:21px;font-weight:900;margin-bottom:6px;text-shadow:2px 2px 0 #000}
#mText{font-size:14px;opacity:.95;margin-bottom:12px;line-height:1.45}
#mBtns{display:flex;flex-direction:column;gap:8px}
#mBtns .row2{display:flex;gap:6px}#mBtns .row2 .pbtn{flex:1}
.btn{padding:11px;font-size:15px}
.btn small{display:block;font-size:12px;color:#ffe066}
.stat{display:flex;justify-content:space-between;background:#0004;border-radius:6px;padding:6px 8px;margin-bottom:5px;font-size:13px}
.stat b{color:#7fff9f}
.ms{font-size:12px;color:#ffd23f;margin:6px 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.card{background:#0005;border:3px solid #555;border-radius:8px;padding:6px 2px;font-size:11px;line-height:1.2}
.card img{height:52px}
.card.lock img{filter:brightness(0) opacity(.5)}
.card b{display:block;font-size:12px}
.reveal{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.ico{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.mgr .ab img{width:12px;height:12px;vertical-align:-2px}
nav .pbtn span img{height:24px}
.twr{position:absolute;pointer-events:none;z-index:1;filter:drop-shadow(0 3px 0 #0006)}
#tut{position:absolute;left:0;right:0;bottom:66px;display:none;align-items:flex-end;gap:4px;padding:0 6px;z-index:30;pointer-events:none}
#tut.on{display:flex}
#tut img{height:118px;flex:none;filter:drop-shadow(0 4px 0 #0007)}
#tut .bub{flex:1;background:#fffaf0;color:#2a1a12;border:3px solid #1b1210;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.35;pointer-events:auto;position:relative;margin-bottom:40px;box-shadow:0 4px 0 #0006}
#tut .bub::before{content:"";position:absolute;left:-12px;bottom:18px;border:9px solid transparent;border-right-color:#1b1210}
#tut .bub button{display:block;margin-top:8px;padding:7px 14px;font-size:14px}
#ring{position:absolute;border:4px solid #ffd23f;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45),0 0 16px #ffd23f;pointer-events:none;z-index:25;display:none;transition:all .25s}
#ring.on{display:block;animation:ringp 1s infinite}
@keyframes ringp{50%{border-color:#fff}}
#ring::after{content:"👆";position:absolute;right:-6px;bottom:-30px;font-size:30px;animation:tapf .8s infinite}
@keyframes tapf{50%{transform:translateY(-8px)}}
.chestbig{height:120px!important}

.flyc{position:absolute;width:22px;height:22px;z-index:45;pointer-events:none;transition:transform .7s cubic-bezier(.45,-.5,.75,1)}
.face.gold{box-shadow:inset 0 0 24px #ffd23f,0 0 24px #ffd23f;animation:goldp .5s infinite alternate}
@keyframes goldp{to{filter:brightness(1.7) sepia(.5) saturate(2)}}
.nmp{display:inline-block;background:#e8761b;color:#fff;font-size:11px;font-weight:900;padding:1px 8px;border-radius:8px;margin-bottom:4px;border:2px solid #1b1210}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.dcell{background:#0005;border:2px solid #555;border-radius:8px;padding:4px 2px;font-size:11px}
.dcell img{height:30px;display:block;margin:2px auto}
.dcell.got{opacity:.4}.dcell.now{border-color:#ffd23f;box-shadow:0 0 10px #ffd23f;animation:pulse 1s infinite}
#lbBtn{width:36px;height:36px;font-size:16px}
.float.combo{color:#ff8a1a;font-size:20px}

header{gap:6px}
.cur{flex:1;min-width:0}
.cur .coins{font-size:20px}
.hsub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gemb{display:flex;align-items:center;gap:4px;background:#0006;border:2px solid #1b1210;border-radius:14px;padding:2px 8px 2px 4px;font-weight:900;font-size:15px;text-shadow:1px 1px 0 #000}
.gemb img{width:20px;height:20px}
#boostBtn{height:36px;padding:0 8px;font-size:12px;white-space:nowrap;line-height:1.1}
#boostBtn.on{background:#2fae5b}
#setBtn{width:36px;height:36px;font-size:16px}
nav{gap:4px;padding:5px}
nav .pbtn{font-size:10px;padding:5px 1px}
nav .pbtn.act{background:#e8761b}
nav .pbtn span{font-size:18px;height:24px;display:flex;align-items:center;justify-content:center}
#panel{position:absolute;left:0;right:0;top:0;bottom:0;z-index:35;background:#2a1a12;display:flex;flex-direction:column}
#panel.hidden{display:none}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#3a2418;border-bottom:3px solid #1b1210}
.ph b{flex:1;font-size:19px;text-shadow:2px 2px 0 #000}
#pClose{width:38px;height:38px;font-size:18px;background:#b8452a}
#pTabs{display:flex;gap:6px;padding:8px 8px 0}
#pTabs:empty{display:none}
#pTabs button{flex:1;padding:7px;font-size:13px}
#pTabs button.on{background:#e8761b}
#pBody{flex:1;overflow-y:auto;padding:8px 8px 20px}
.sec{font-size:12px;font-weight:900;color:#ffd23f;margin:10px 4px 6px;letter-spacing:.5px}
.item{display:flex;align-items:center;gap:10px;background:#3a2418;border:3px solid #1b1210;border-radius:12px;padding:8px;margin-bottom:8px;box-shadow:inset 0 -3px 0 #0004}
.item .ic{width:46px;height:46px;object-fit:contain;flex:none}
.item .tx{flex:1;font-size:12px;line-height:1.3;min-width:0}
.item .tx b{display:block;font-size:14px}
.item .tx small{opacity:.8}
.item .pbtn{padding:8px 8px;font-size:12px;min-width:86px;line-height:1.2}
.item .pbtn small{display:block;font-size:11px;color:#ffe066}
.item .pbtn img{width:14px;height:14px;vertical-align:-2px}
.lvbar{height:6px;background:#0008;border-radius:3px;margin-top:4px;overflow:hidden}
.lvbar i{display:block;height:100%;background:#7fff9f}
.mport{width:54px;height:54px;border-radius:50%;border:3px solid #888;background:#0006;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.mport img{width:46px}
.rtag{display:inline-block;font-size:10px;font-weight:900;padding:0 6px;border-radius:6px;color:#1b1210;margin-left:4px;vertical-align:1px}
.hire{display:flex;align-items:center;gap:10px;background:linear-gradient(#5a3b24,#3a2418);border:3px solid #e0a400;border-radius:12px;padding:10px;margin-bottom:10px}
.hire .tx{flex:1;font-size:12px}.hire .pbtn{padding:8px;font-size:13px;min-width:90px;line-height:1.2}.hire .pbtn small{display:block;font-size:11px;color:#ffe066}.hire .tx b{display:block;font-size:15px}
.ctx{background:#2fae5b33;border:2px dashed #2fae5b;border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:8px;font-weight:700}
.node{display:flex;align-items:center;gap:12px;background:#3a2418;border:3px solid #1b1210;border-radius:16px;padding:10px;margin:0 6px 30px;position:relative}
.node::after{content:"";position:absolute;left:38px;bottom:-33px;height:30px;border-left:5px dotted #e0a400}
.node:last-child::after{display:none}
.node .pic{width:64px;height:64px;border-radius:50%;background-size:44px;border:3px solid #1b1210;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 12px #000a}
.node .pic img{width:40px}
.node .tx{flex:1;font-size:12px;line-height:1.35}.node .tx b{display:block;font-size:16px}
.node.cur{border-color:#ffd23f;box-shadow:0 0 14px #ffd23f88}
.node.done{opacity:.75}
.node.lock .pic,.node.lock .tx{filter:grayscale(.85) brightness(.6)}
.node .pbtn{padding:8px 10px;font-size:13px}
.prog{height:8px;background:#0008;border-radius:4px;margin-top:5px;overflow:hidden}.prog i{display:block;height:100%;background:#ffd23f}
.tgl{display:flex;justify-content:space-between;align-items:center;background:#0004;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
</style>
</head>

<script type="text/plain" id="mainjs">
// =====================================================================
//  ЭКОНОМИКА (подобрана симуляцией)

const MS=[10,25,50,100,150,200,300,400];
const msMul=L=>Math.pow(2,MS.filter(m=>L>=m).length);
const nextMs=L=>MS.find(m=>m>L);
// Подобрано симуляцией «живого игрока» (4 захода в день + офлайн):
// шахта 2 ≈ 4–5 мин, шахта 4 ≈ 30 мин игры, шахты 5–7 — первый день, шахта 8 ≈ 2,5 дня
const OPEN=[0,8000,3e6,1.5e8,4.5e9,1.35e11,4.05e12,1.215e14,3.6e15,1.1e17];
const ECO={
  out:(i,L)=>8*Math.pow(14,i)*L*msMul(L),
  workers:L=>Math.min(6,1+Math.floor(L/10)),
  shUp:(i,L)=>Math.ceil(20*Math.pow(18.2,i)*Math.pow(1.16,L-1)),
  open:i=>OPEN[i]||OPEN[OPEN.length-1]*Math.pow(30,i-OPEN.length+1),
  eCap:L=>50*L*Math.pow(1.12,L-1),
  eSpd:L=>Math.min(5,1.2+0.06*(L-1)),
  eUp:L=>Math.ceil(60*Math.pow(1.14,L-1)),
  wCap:L=>50*L*Math.pow(1.12,L-1),
  wTrip:L=>Math.max(2.2,5-0.05*(L-1)),
  wUp:L=>Math.ceil(60*Math.pow(1.14,L-1)),
};
const SHAFT_MAX=10, PRESTIGE_AT=8;
const WALK=1.6, DIG=1.2;
const BOOST_STEP=30*60*1000, BOOST_MAX=4*3600*1000, AD_GAP=90*1000, FREE_CHEST_MS=4*3600*1000, AD_CHEST_GAP=3*60*1000, AD_GEM_GAP=5*60*1000;

const WORLDS=[
  {name:_T('Деревня'),     mult:1,    t0:0, sky:['#4aa8f0','#bfe9ff'], hill:'#5aa83a', mount:'#8aa6c8'},
  {name:_T('Горы'),        mult:10,   t0:2, sky:['#7aa6e0','#eef5ff'], hill:'#7d9a6a', mount:'#d8e2ef'},
  {name:_T('Пещерный град'),mult:100, t0:3, sky:['#1f1b38','#4f4570'], hill:'#3e3656', mount:'#2a2540'},
  {name:_T('Вулкан'),      mult:1000, t0:5, sky:['#4a1712','#e0743a'], hill:'#3a2420', mount:'#5a2a20'},
  {name:_T('Котоверсум'),  mult:10000,t0:7, sky:['#250d45','#ff8fe0'], hill:'#5a2f8a', mount:'#8a4fc0'},
  {name:_T('Сердце Земли'),mult:100000,t0:8, sky:['#3a1a5a','#ffd23f'], hill:'#8a4fc0', mount:'#ff8fe0'},
];
const worldAt=k=>k<WORLDS.length?WORLDS[k]:{...WORLDS[WORLDS.length-1],name:_T('Сердце Земли ')+(k-WORLDS.length+2),mult:WORLDS[WORLDS.length-1].mult*Math.pow(10,k-WORLDS.length+1)};

const RAR=[{n:_T('Обычный'),c:'#c9c9c9',w:50},{n:_T('Редкий'),c:'#4fc3ff',w:24},{n:_T('Эпический'),c:'#c77dff',w:10},{n:_T('Легендарный'),c:'#ffd23f',w:4}];
const CARDS=[
  {id:'ryzhik', name:_T('Рыжик'),          rar:0,img:0,bon:'spd', per:.10,txt:_T('скорость шахтёров')},
  {id:'seryi',  name:_T('Серый шахтёр'),   rar:0,img:1,bon:'out', per:.10,txt:_T('добыча шахт')},
  {id:'chernyi',name:_T('Чёрный прораб'),  rar:1,img:2,bon:'ecap',per:.15,txt:_T('вместимость лифта')},
  {id:'belyi',  name:_T('Белый строитель'),rar:1,img:3,bon:'wcap',per:.15,txt:_T('вместимость склада')},
  {id:'robo',   name:_T('Котоборг'),       rar:2,img:4,bon:'move',per:.15,txt:_T('скорость лифта и тележки')},
  {id:'mag',    name:_T('Кот-волшебник'),  rar:3,img:5,bon:'inc', per:.25,txt:_T('весь доход')},
];
const bonus=b=>CARDS.reduce((s,c)=>s+(c.bon===b?c.per*(S.cards[c.id]||0):0),0)+RES.reduce((s,r)=>s+(r.bon===b?r.per*((S.res||{})[r.id]||0):0),0);

// =====================================================================
const freshMine=()=>({sh:[{l:1,m:0,st:0}],el:{l:1,m:0},wh:{l:1,m:0},top:0,ab:{}});
let S={coins:0,gems:25,world:0,...freshMine(),mg:[],hire:{s:0,e:0,w:0},mgId:1,cards:{},res:{},q:0,qBase:0,qGoal:0,
  st:{taps:0,earned:0,chests:0,abil:0,moves:0,hires:0},boostUntil:0,freeChestAt:0,adChestAt:0,adGemAt:0,sound:true,music:true,t:Date.now()};
const R={w:[],el:{y:0,ph:'idle',t:0,load:0,k:0,go:0},tr:{x:1,ph:'idle',t:0,load:0,go:0}};

const $=id=>document.getElementById(id);
function fmt(n){
  if(n<1000)return Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return n.toFixed(n<10?2:n<100?1:0)+u[i];
}

// ---------- характеристики с учётом бонусов ----------
const abOn=k=>(S.ab[k]&&S.ab[k].until>Date.now());
const slotObj=k=>k==='e'?S.el:k==='w'?S.wh:S.sh[+k.slice(1)];
const mgrById=id=>S.mg.find(m=>m.id===id);
const mgrOf=k=>{const o=slotObj(k);return o&&o.m?mgrById(o.m):null;};
const RARM=[{n:_T('Младший'),c:'#c9c9c9',mul:2,dur:60,disc:.2},{n:_T('Старший'),c:'#4fc3ff',mul:3,dur:90,disc:.35},{n:_T('Директор'),c:'#ffd23f',mul:5,dur:120,disc:.5}];
const abM=(k,t)=>{const m=mgrOf(k);return m&&m.t===t&&abOn(k)?RARM[m.r].mul:1;};
const disc=k=>{const m=mgrOf(k);return m&&m.t==='cost'&&abOn(k)?1-RARM[m.r].disc:1;};
const spdMul=i=>(1+bonus('spd'))*abM('s'+i,'spd');
const workerOut=i=>ECO.out(i,S.sh[i].l)*(1+bonus('out'))*veinMul(i)*abM('s'+i,'out');
const veinMul=i=>S.vein&&S.vein.i===i&&S.vein.until>Date.now()?S.vein.mult:1;
const elevCap=()=>ECO.eCap(S.el.l)*(1+bonus('ecap'))*abM('e','cap');
const elevSpd=()=>ECO.eSpd(S.el.l)*(1+bonus('move'))*abM('e','spd');
const whCap=()=>ECO.wCap(S.wh.l)*(1+bonus('wcap'))*abM('w','cap');
const whTrip=()=>ECO.wTrip(S.wh.l)/(1+bonus('move'))/abM('w','spd');
const boostOn=()=>Date.now()<S.boostUntil;
const price=()=>world().mult*(1+bonus('inc'))*(boostOn()?2:1);
const basePrice=()=>world().mult*(1+bonus('inc'));
function rates(onlyMgr){
  const n=S.sh.length;
  const sh=S.sh.map((s,i)=>(onlyMgr&&!s.m)?0:ECO.workers(s.l)*workerOut(i)/((2*WALK+DIG)/spdMul(i)));
  const sum=sh.reduce((a,b)=>a+b,0);
  const el=(onlyMgr&&!S.el.m)?0:elevCap()/(2*n/elevSpd()+n*.4+.4);
  const wh=(onlyMgr&&!S.wh.m)?0:whCap()/(whTrip()+.9);
  return {sh,sum,el,wh,min:Math.min(sum,el,wh)};
}

function startShaft(i,byTap){
  const arr=R.w[i];if(!arr)return;
  let started=false;
  arr.forEach((w,j)=>{if(w.ph==='idle'){w.ph='go';w.p=0;w.d=j*.3;started=true;}});
  if(started&&byTap){S.st.taps++;tone(260);}
}
function step(dt){
  // шахтёры
  S.sh.forEach((s,i)=>{
    const sp=spdMul(i),walk=WALK/sp,dig=DIG/sp,out=workerOut(i);
    (R.w[i]||[]).forEach(w=>{
      w.f+=dt;
      if(w.ph==='idle'){if(s.m){w.ph='go';w.p=0;}return;}
      if(w.d>0){w.d-=dt;return;}
      if(w.ph==='go'){w.p+=dt/walk;if(w.p>=1){w.p=1;w.ph='dig';w.t=0;}}
      else if(w.ph==='dig'){w.t+=dt;const h=Math.floor(w.t/.36);if(h!==w.h){w.h=h;digFx(i);}if(w.t>=dig){w.ph='back';w.carry=out;w.h=-1;}}
      else if(w.ph==='back'){w.p-=dt/walk;if(w.p<=0){w.p=0;s.st+=w.carry;w.carry=0;w.ph=s.m?'go':'idle';}}
    });
  });
  // лифт
  const E=R.el,n=S.sh.length,spd=elevSpd(),cap=elevCap();
  if(E.ph==='idle'){if(S.el.m||E.go){E.go=0;E.ph='down';E.k=0;E.load=0;}}
  else if(E.ph==='down'){E.y+=spd*dt;if(E.y>=E.k+1){E.y=E.k+1;E.ph='load';E.t=0;}}
  else if(E.ph==='load'){E.t+=dt;if(E.t>=.4){const s=S.sh[E.k],take=Math.min(cap-E.load,s.st);s.st-=take;E.load+=take;
      if(E.load>=cap*.999||E.k>=n-1)E.ph='up';else{E.k++;E.ph='down';}}}
  else if(E.ph==='up'){E.y-=spd*dt;if(E.y<=0){E.y=0;E.ph='unload';E.t=0;}}
  else if(E.ph==='unload'){E.t+=dt;if(E.t>=.4){S.top+=E.load;E.load=0;if(S.el.m){E.ph='down';E.k=0;}else E.ph='idle';}}
  // тележка (1 — у склада, 0 — у лифта)
  const T=R.tr,half=whTrip()/2;
  if(T.ph==='idle'){if(S.wh.m||T.go){T.go=0;T.ph='go';}}
  else if(T.ph==='go'){T.x-=dt/half;if(T.x<=0){T.x=0;T.ph='load';T.t=0;}}
  else if(T.ph==='load'){T.t+=dt;if(T.t>=.5){const take=Math.min(whCap(),S.top);S.top-=take;T.load=take;T.ph='back';}}
  else if(T.ph==='back'){T.x+=dt/half;if(T.x>=1){T.x=1;T.ph='sell';T.t=0;}}
  else if(T.ph==='sell'){T.t+=dt;if(T.t>=.4){
      if(T.load>0){const v=T.load*price();S.coins+=v;S.st.earned+=v;floatWorld(VW-70,SURF-70,'+'+fmt(v));coinSnd();saleFx();}
      T.load=0;T.ph=S.wh.m?'go':'idle';}}
}

  fctx.imageSmoothingEnabled=true;fctx.imageSmoothingQuality='high';
  const xL=ELW+70,xR=VW-40;
  // шахтёры
  S.sh.forEach((s,i)=>{
    const top=SURF+i*ROW-sc;if(top>VH||top+ROW<0)return;
    const arr=R.w[i]||[];
    arr.forEach((w,j)=>{
      let im=IMG.cat[0],flip=false,bob=0,h=46;
      const wf=Math.floor(w.f*11)%6;
      if(w.ph==='dig'&&w.d<=0)im=IMG.cat[[2,3,4][Math.floor(w.t/.12)%3]];
      else if(w.ph==='go'&&w.d<=0){im=IMG.walk[wf];h=50;}
      else if(w.ph==='back'){im=IMG.carry[wf];flip=true;h=50;}
      else if(w.ph==='idle'&&(w.f%4)<.15)im=IMG.cat[1];
      const wd=h*im.width/im.height;
      const x=xL+(xR-xL)*w.p-wd/2-(j%3)*7*(w.ph==='dig'?1:0)-(w.ph==='idle'?j*16:0);
      const y=top+ROW-10-h-bob-(j%2)*3;
      if(flip){fctx.save();fctx.translate(x+wd/2,0);fctx.scale(-1,1);fctx.drawImage(im,-wd/2,y,wd,h);fctx.restore();}
      else fctx.drawImage(im,x,y,wd,h);
    });
    if(!s.m&&arr.every(w=>w.ph==='idle'))hint(xL+60,top+ROW-70,_T('Тапни!'));
  });
  // лифт
  const E=R.el,cy=SURF-102+E.y*ROW-sc;
  if(cy>-100&&cy<VH){
    fctx.fillStyle='#777';fctx.fillRect(ELW/2-1,Math.max(SURF-120-sc,cy-400),2,cy-Math.max(SURF-120-sc,cy-400));
    const mv=E.ph==='down'||E.ph==='up',t=performance.now()/1000;
    const im=IMG.cab[mv?3+Math.floor(t*7)%3:Math.floor(t*2.5)%3];
    const cw=ELW-8,ch=cw*im.height/im.width;fctx.drawImage(im,4,cy+82-ch,cw,ch);
    if(E.load>0)label(ELW/2,cy+82-ch-4,fmt(E.load*basePrice()));
  }
  if(!S.el.m&&E.ph==='idle')hint(ELW/2+6,SURF-150-sc,_T('Тапни!'));
  // тележка
  const T=R.tr,ty=SURF-24-sc;
  if(ty>-60&&ty<VH+60){
    const x0=ELW+96,x1=VW-118,x=x0+(x1-x0)*T.x,back=T.ph==='back'||T.ph==='sell',mv=T.ph==='go'||T.ph==='back';
    const im=IMG.cart[mv?Math.floor(performance.now()/90)%6:0],h=48,wd=h*im.width/im.height;
    if(!back){fctx.save();fctx.translate(x,0);fctx.scale(-1,1);fctx.drawImage(im,-wd/2,ty-h+2,wd,h);fctx.restore();}
    else fctx.drawImage(im,x-wd/2,ty-h+2,wd,h);
    if(T.load>0)label(x,ty-h-2,fmt(T.load*basePrice()));
  }
  if(!S.wh.m&&T.ph==='idle')hint(VW-60,SURF-130-sc,_T('Тапни!'));
  drawFx(sc);
}

function unitInfo(u){
  if(u.t==='sh'){const s=S.sh[u.i];return {name:_T('Шахта ')+(u.i+1),L:s.l,cost:k=>Math.ceil(ECO.shUp(u.i,k)*disc('s'+u.i)),set:L=>{s.l=L;syncWorkers();}};}
  if(u.t==='el')return {name:_T('Лифт'),L:S.el.l,cost:k=>Math.ceil(ECO.eUp(k)*disc('e')),set:L=>S.el.l=L};
  return {name:_T('Склад'),L:S.wh.l,cost:k=>Math.ceil(ECO.wUp(k)*disc('w')),set:L=>S.wh.l=L};
}
function bulk(u,n){ // n=-1 — максимум
  const I=unitInfo(u);let L=I.L,sum=0,k=0;
  while(n<0||k<n){const c=I.cost(L+k);if(n<0&&sum+c>S.coins)break;sum+=c;k++;if(k>=500)break;}
  return {k,sum};
}
function statLines(u,L){
  const pm=basePrice();
  if(u.t==='sh'){const w=ECO.workers(L),o=ECO.out(u.i,L)*(1+bonus('out'));
    return [[_T('Шахтёров'),w],[_T('Добыча за ходку'),fmt(o*pm)],[_T('Доход шахты'),fmt(w*o*pm/((2*WALK+DIG)/spdMul(u.i)))+_T('/с')]];}
  if(u.t==='el')return [[_T('Вместимость'),fmt(ECO.eCap(L)*(1+bonus('ecap'))*pm)],[_T('Скорость'),(ECO.eSpd(L)*(1+bonus('move'))).toFixed(2)+_T(' эт/с')]];
  return [[_T('Вместимость'),fmt(ECO.wCap(L)*(1+bonus('wcap'))*pm)],[_T('Время рейса'),(ECO.wTrip(L)/(1+bonus('move'))).toFixed(1)+_T(' с')]];
}
function openUpgrade(u){
  const I=unitInfo(u);
  const a=statLines(u,I.L),b=statLines(u,I.L+1);
  const html=a.map((r,j)=>`<div class="stat"><span>${r[0]}</span><span>${r[1]} → <b>${b[j][1]}</b></span></div>`).join('')+
    (u.t==='sh'&&nextMs(I.L)?`<div class="ms"><img class="ico" src="${ASSETS2.i_star}${_T("\"> На ур. ")}${nextMs(I.L)}${_T(": добыча ×2")}${u.t==='sh'?_T(' и новый шахтёр'):''}</div>`:'');
  const b1=bulk(u,1),b10=bulk(u,10),bm=bulk(u,-1);
  modal(null,`${I.name}${_T(" · ур. ")}${I.L}`,html,[
    {row:[
      {t:`×1<small>${fmt(b1.sum)}</small>`,cls:'green',dis:S.coins<b1.sum,keep:true,fn:()=>{buy(u,1);openUpgrade(u);}},
      {t:`×10<small>${fmt(b10.sum)}</small>`,cls:'green',dis:S.coins<b10.sum,keep:true,fn:()=>{buy(u,10);openUpgrade(u);}},
      {t:`MAX ${bm.k}<small>${fmt(bm.sum)}</small>`,cls:'green',dis:bm.k<1,keep:true,fn:()=>{buy(u,-1);openUpgrade(u);}},
    ]},
    {t:_T('Закрыть')}
  ]);
}
function buy(u,n){
  const I=unitInfo(u),b=bulk(u,n);if(b.k<1||S.coins<b.sum)return;
  S.coins-=b.sum;I.set(I.L+b.k);
  upFx(MS.some(m=>m>I.L&&m<=I.L+b.k));
  ui(true);
}

  const L=CARDS.filter(c=>c.rar>=(minR||0)),tot=L.reduce((s,c)=>s+RAR[c.rar].w,0);let r=Math.random()*tot;
  for(const c of L){r-=RAR[c.rar].w;if(r<=0)return c;}return L[0];

  const now=performance.now();if(!force&&now-lastUI<150)return;lastUI=now;
  if(!els.rows)return;
  const r=rates(),pm=basePrice(),pr=price(),D=Date.now();
  $('coins').textContent=fmt(S.coins);$('gems').textContent=fmt(S.gems);
  $('inc').textContent=fmt(r.min*pr);
  $('wname').textContent=world().name;
  const bn=r.min===r.el?'el':r.min===r.wh?'wh':'sh';
  const setUp=(b,L,c,isBn)=>{b.querySelector('span').textContent=_T('ур. ')+L;b.querySelector('small').textContent=fmt(c);b.classList.toggle('can',S.coins>=c);b.classList.toggle('bn',isBn);};
  setUp(els.eUp,S.el.l,unitInfo({t:'el'}).cost(S.el.l),bn==='el');
  setUp(els.wUp,S.wh.l,unitInfo({t:'wh'}).cost(S.wh.l),bn==='wh');
  els.pile.textContent=fmt(S.top*pm);
  S.sh.forEach((s,i)=>{const e=els.rows[i];if(!e)return;
    setUp(e.up,s.l,unitInfo({t:'sh',i}).cost(s.l),false);
    e.box.textContent=fmt(s.st*pm);const full=s.st>0;if(e.crate._f!==full){e.crate._f=full;e.crate.src=full?ASSETS2.crate1:ASSETS2.crate0;}
    e.rate.textContent=fmt(r.sh[i]*pm)+_T('/с')+(veinMul(i)>1?` 🔥×${S.vein.mult} ${Math.ceil((S.vein.until-D)/1000)}${_T("с")}`:'');e.face.classList.toggle('gold',veinMul(i)>1||!!(EV&&EV.type==='vein'&&EV.i===i));});
  if(bn==='sh'&&els.rows.length){els.rows.forEach(e=>e.up.classList.remove('bn'));}
  const mg=(b,key,o)=>{b.classList.toggle('none',!o.m);const ab=b.querySelector('.ab'),mm=o.m&&mgrById(o.m);
    b.style.borderColor=mm?RARM[mm.r].c:'#1b1210';
    if(!o.m){ab.style.display='none';return;}ab.style.display='';const a=S.ab[key]||{until:0,cd:0};
    const act=D<a.until,pi=b.querySelector('img'),want=ASSETS2.mgr[b._mi+(act&&Math.floor(D/300)%2?1:0)];if(pi._s!==want){pi._s=want;pi.src=want;}
    if(act){ab.className='ab act';ab.innerHTML=`<img src="${ASSETS2.i_bolt}">`+Math.ceil((a.until-D)/1000);}
    else if(D<a.cd){ab.className='ab';ab.textContent=tm(a.cd-D);}
    else{ab.className='ab ready';ab.innerHTML=`<img src="${ASSETS2.i_bolt}">`;}};
  mg(els.eMgr,'e',S.el);mg(els.wMgr,'w',S.wh);S.sh.forEach((s,i)=>els.rows[i]&&mg(els.rows[i].mgr,'s'+i,s));
  if(els.lock){const c=ECO.open(S.sh.length);els.lock.querySelector('small').textContent=fmt(c);els.lock.classList.toggle('green',S.coins>=c);}
  // задание
  const q=curQuest(),[p,g]=q.c(),done=p>=g;
  $('qText').textContent=q.t+_T('  · награда: ')+questReward(q).txt;
  $('qFill').style.width=Math.min(100,p/g*100)+'%';$('qBtn').classList.toggle('show',done);
  // нижние кнопки
  $('shopDot').classList.toggle('on',D>=S.freeChestAt||D>=S.adGemAt);
  $('mapDot').classList.toggle('on',S.sh.length>=PRESTIGE_AT);
  $('resDot').classList.toggle('on',RES.some(r=>(S.res[r.id]||0)<r.max&&S.gems>=resCost(r)));
  const bb=$('boostBtn');bb.classList.toggle('on',boostOn());const bt=boostOn()?'🔥×2 '+tm(S.boostUntil-D):'📺 ×2';if(bb.textContent!==bt)bb.textContent=bt;
  if(PAN&&now-pT>700){pT=now;renderPanel();}
}

// =====================================================================
//  ЦИКЛ, ОФЛАЙН, СТАРТ
// =====================================================================
let lastT=performance.now(),tutT=0,surfT=0;
function loop(t){
  const dt=Math.min((t-lastT)/1000,.1);lastT=t;
  if(!pauses.size){step(dt);evTick(dt);}
  fxStep(dt);if(t-surfT>45&&els.surf){surfT=t;drawSurface(els.surf,VW);}
  draw();ui();
  if(t-tutT>120){tutT=t;tutTick();}
  requestAnimationFrame(loop);
}
function offline(prevT){
  const sec=Math.min((3+bonus('off'))*3600,(Date.now()-prevT)/1000);if(sec<60)return;
  const r=rates(true),earn=r.min*basePrice()*sec;if(earn<=0)return;
  modal(ASSETS.help[0],_T('Коты не спали!'),`${_T("Пока тебя не было (")}${tm(sec*1000)}${_T("), менеджеры заработали <b style=\"color:#ffe066\">")}${fmt(earn)}${_T("</b> монет")}`,[
    {t:`${_T("📺 Забрать ×2<small>")}${fmt(earn*2)}</small>`,cls:'orange',fn:async()=>{S.coins+=(await SDK.rewarded())?earn*2:earn;coinSnd();}},
    {t:`${_T("Забрать ")}${fmt(earn)}`,fn:()=>{S.coins+=earn;}}]);
}
document.addEventListener('contextmenu',e=>e.preventDefault());
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(buildWorld,150);});
(async()=>{
  document.body.style.background=`linear-gradient(90deg,rgba(15,8,5,.55),rgba(15,8,5,.8) 50%,rgba(15,8,5,.55)),url(${ASSETS.tile[2]}) 0 0/72px 72px`;
  $('app').style.boxShadow='0 0 0 4px #1b1210,0 0 40px #000';
  $('coinImg').src=ASSETS2.i_coin;$('gemImg').src=ASSETS2.i_gem;$('navCat').src=ASSETS.help[0];$('nShopI').src=ASSETS2.i_gift;$('nMgrI').src=ASSETS2.mgr[0];$('nResI').src=ASSETS2.i_cry;
  await loadAssets();
  await SDK.init();
  const saved=await SDK.load();
  if(saved){S=Object.assign(S,saved);S.st=Object.assign({taps:0,earned:0,chests:0,abil:0,moves:0},saved.st||{});if(S.tut===undefined&&(S.sh[0].m||S.st.moves))S.tut=99;
    S.mg=S.mg||[];S.hire=S.hire||{s:0,e:0,w:0};S.res=S.res||{};S.mgId=S.mgId||1;if(S.gems===undefined)S.gems=25;
    // перенос старых сохранений: менеджер был флагом 1 — создаём младшего
    [['e',S.el],['w',S.wh],...S.sh.map((s,i)=>['s'+i,s])].forEach(([k,o])=>{if(o.m&&!mgrById(o.m)){const m={id:S.mgId++,a:k[0],r:0,t:'spd',name:MNAMES[S.mgId%MNAMES.length]};S.mg.push(m);o.m=m.id;}});}
  if(!S.d0)S.d0=Date.now()-DAY_LEN*1000*.85;
  buildWorld();
  SDK.ready();SDK.gpStart();
  if(saved)offline(saved.t||Date.now());
  if(S.tut>=TUT.length)queueModal(checkDaily);
  setInterval(()=>{if(S.tut>=TUT.length&&S.dLast!==today())queueModal(checkDaily);lbSubmit();},60000);
  setInterval(()=>SDK.save(false),5000);
  setInterval(()=>SDK.save(true),30000);
  requestAnimationFrame(loop);
})();
</script>
<script>
(async()=>{
  let lang=new URLSearchParams(location.search).get('lang');
  if(!lang)lang=new URLSearchParams(location.search).get('vk_language');
  if(!lang)lang=(navigator.language||'ru').slice(0,2).toLowerCase();
  LANG=['ru','be','kk','uk','uz'].includes(lang)?'ru':'en';
  document.documentElement.lang=LANG;document.title=_T(document.title);
  if(LANG==='en'){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;const todo=[];
    while(n=w.nextNode()){if(n.parentNode.tagName==='SCRIPT')continue;const t=n.nodeValue.trim();if(t&&EN[t]!==undefined)todo.push([n,t]);}
    todo.forEach(([n,t])=>n.nodeValue=n.nodeValue.replace(t,EN[t]));}
  const sc=document.createElement('script');sc.textContent=document.getElementById('mainjs').textContent;document.body.appendChild(sc);
})();
</script>
